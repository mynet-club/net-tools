# llmproxy 配置示例
#
# 安装后本文件会被复制到运行时目录（macOS/Linux: ~/.config/llmproxy/config.yaml）。
# 修改保存后自动热加载，不需要重启；也可以 `llmproxy reload` 或 `kill -HUP <pid>`。
# 新配置校验失败时保留旧配置继续服务，错误写入日志。

server:
  host: 127.0.0.1          # 默认只听本机。改成 0.0.0.0 前请务必先设置 api_keys
  port: 8787
  api_keys:                # 下游客户端凭证（Bearer token）。留空且 host 非本机时拒绝启动
    - sk-local-change-me
  max_body_mb: 16          # 请求体上限，超过返回 413
  request_timeout_ms: 300000  # **非流式**请求的总时长上限（也是流式的兜底，见下一行）
  # 流式请求的空闲上限：连续这么久没收到任何字节就判失败（默认 120000）。
  # 流式不受上面那个总时限约束 —— 一次长回答正常就要跑几分钟，按总时限掐会把好端端的流切断；
  # 而"上游卡住不动"该早点失败，所以改看有没有动静。显式写 0 = 关闭（退回总时限行为）。
  # 阈值要大于上游的正常 TTFT（DeepSeek 系常见 10~30s），否则慢启动会被误杀。
  stream_idle_timeout_ms: 120000
  # 会话粘性保留时长（毫秒）：同一个 (用户, 会话, 模型) 在这段时间内钉在同一家供应商上。
  # 目的不是负载均衡，是**保住上游的前缀缓存** —— 缓存按（账号+模型）分区，
  # 权重随机换家等于每次从冷缓存重来。键里带模型是因为一个会话会调多个模型。
  # 显式写 0 = 关闭（请求照旧按权重随机）；没配 = 24 小时。
  # 会话 id 来自下游的 x-session-affinity 请求头（MiMoCode 会发）。
  affinity_ttl_ms: 86400000

  # 收紧**用户自配上游**（/v1/_me/providers）的出网范围：打开后回环与私网地址
  # （RFC1918 / ULA）一律拒绝，只许公网。默认关闭，因为「上游就是本机或同网段的
  # 一台推理服务器」（ollama、vLLM、公司内部网关）是正当用法。
  # 把网关暴露到局域网、且用户不完全可信时再打开 —— 那时一个用户可控的 base_url
  # 等于「以网关的网络位置读内网」的能力。
  # 注意：link-local（含云元数据 169.254.169.254）与未指定地址**不受这个开关影响，
  # 一律拒绝**；config.yaml 里的系统池是你自己写的，也始终不受限。
  block_local_upstream: false

  # 多用户（中转器）模式的管理凭证：设了才有 /v1/_admin，留空则管理接口整体关闭。
  # 用户本身用 llmproxy user add 管理（存在数据库里），不写在这份配置里。
  # admin_token: ${LLMPROXY_ADMIN_TOKEN}

routing:
  retry: 2                 # 首次失败后再换多少个供应商重试（0 = 不重试）
  failure_threshold: 3     # 连续失败达到几次后临时摘除该供应商
  cooldown_seconds: 60     # 摘除后多少秒自动恢复，恢复后重新参与权重选择

# 代理池：供应商通过 proxy 字段按名字引用
# 支持 http://  socks5://  socks5h://（h = 由代理解析域名）
# 也支持直接写内联地址：proxy: "http://127.0.0.1:7890"
proxies:
  - name: us-http
    url: http://127.0.0.1:7890
  - name: jp-socks
    url: socks5://user:password@127.0.0.1:1081

providers:
  # max_data_level = 这家上游**最多能承接哪个数据分级**（public < internal <
  # confidential < restricted，见 §2.3）。3.0 的分级门直接比它：请求的有效分级
  # 高于它时，这一家不参与选路（enforce 下会被排除）。
  # policy.mode ≠ legacy 时，**已启用的供应商必须逐家显式写它** —— 加载期就会拒绝：
  # 猜 public 会把敏感流量放行到不该去的上游，猜 restricted 会让分级门永不生效，
  # 两种猜法都会在审计里留下「看起来配好了」的计划。暂时不启用 3.0 就写
  # policy.mode: legacy，这个字段可以不填（填了也不参与判定，拼错照样报错）。
  # ---- OpenAI 官方 ----
  - name: openai-main
    enabled: true
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}      # 支持 ${ENV_VAR} 展开，避免密钥写进文件
    weight: 10                      # 相对权重，越大被选中概率越高
    max_data_level: internal        # 3.0 参与判定时的必填项（见本段开头）
    proxy: us-http                  # direct / 留空 = 直连；也可写代理名或内联 URL
    timeout_ms: 120000
    models:                         # 下游模型名 → 上游真实模型名
      gpt-4o: gpt-4o-2024-11-20
      gpt-4o-mini: gpt-4o-mini
    extra_headers:                  # 可选：附加到上游请求头
      X-Title: llmproxy

  # ---- 同模型池的第二个供应商，按权重分摊 ----
  - name: openai-backup
    enabled: true
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY_BACKUP}
    weight: 3
    proxy: direct
    models:
      gpt-4o: gpt-4o-2024-11-20

  # ---- 直通型供应商：下游模型名原样发给上游 ----
  - name: deepseek
    enabled: true
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    weight: 5
    proxy: direct
    models: ["*"]                   # "*" = 任意模型名直通
    timeout_ms: 180000

  # ---- 已停用的供应商：保留配置但不参与选择 ----
  - name: some-broken-vendor
    enabled: false
    base_url: https://example.com/v1
    api_key: sk-xxx
    weight: 1
    models:
      gpt-4o: some-model

database:
  path: ""             # 留空 = 运行时目录下的 data/llmproxy.db
  retain_days: 90      # 请求明细保留天数，超期自动清理；**显式 0 = 永久保留**，留空 = 90 天
                       # 注意 requests 表就是计价冻结账本（价目行 id 与金额都在里面），
                       # 要长期对账就设成 0，否则可审计期只有这么多天

log:
  level: info          # debug | info | warn | error
  max_mb: 10           # 单个日志文件上限
  keep: 5              # 轮转保留份数

# ============================ 3.0 接线（§3.0）============================
# 下面这一段全部注释掉 = 3.0 不参与，请求走原有的 provider 路由（legacy）。
# 升级二进制不需要动配置文件：整段缺省就是 legacy，行为与 2.x 完全一致。
#
# config_schema_version 是**配置文件结构**版本（只用于加载与迁移校验，
# 现在支持 2 与 3）；它和策略内容版本（bundle 的 id@version）是两码事 ——
# 后者才进路由决策、审计和回放。写一个比本二进制更高的结构版本会直接拒绝启动，
# 这是刻意的：先升程序再改配置，反过来会让新字段被静默忽略。
# config_schema_version: 3
# policy:
#   # shadow = 旁路影子运行：解析身份、策略与候选计划，记录差异和耗时，
#   #          但**不改变**实际 provider、不读正文、不碰计量/熔断/粘性/供应商状态。
#   #          影子模式同样产出 policy version，否则事后没法复现「当时算出了什么」。
#   # enforce = 允许新策略影响路由与处理器。
#   # legacy = 完全沿用现有 provider 路由。
#   mode: shadow
#   # 3.0 算不出可用计划时是否回落旧路由。缺省 true —— §3.0 要求
#   # 「任何新路径都必须可以按 scope 回滚到 legacy」。
#   # 显式 false 是 fail-closed 决定：新路径没计划就直接失败。
#   # 注意 shadow 下这个开关没有作用点（影子本来就不改路由），写了会报错。
#   fallback_to_legacy: true
#   # 生效的是哪一版策略。审计与回放里的 policy_version 就是这里的 id@version，
#   # 唯一来源是实际加载的 bundle，不允许 handler 临时拼。
#   active_bundle: university-default-v1
#   # bundles 只是**引用**（生效范围 + 版本号）；授权内容（entitlements）
#   # 由管理面（策略发布/回滚）持有。两边都写内容就会出现两个真值来源，
#   # 回滚时互相打脸。
#   bundles:
#     - id: university-default-v1
#       version: 1                   # 从 1 起；0 分不清「没填」和「第 0 版」
#       scope: organization:university   # 必须写成 kind:id（user|organization|project|system）

# ============================ 处理器声明表（§2.6 / §3.H）============================
# 这一段只声明**约束**：阶段、正文档位、大小与超时上限、失败策略、出网白名单。
# 运行参数（脱敏类型子集、字段替换规则、JSON Schema、过滤词表、sidecar 的端点与请求头）
# 不在这里，而在 **<配置文件目录>/processor_params/<声明名>.json**：
#
#   processor_params/pii-cn.json          →  {"pii_types":["email","phone"]}
#   processor_params/schema-check.json    →  {"schema":{…}}
#   processor_params/rewrite.json         →  {"endpoint":"https://…","headers":{…}}
#   processor_params/kb-inject.json       →  {"max_passages":4,"max_total_bytes":32768}
#
# 每条声明可写的键按类型固定（写错类型或多余的键都在**启动期**报错，不会静默忽略 ——
# 「配了 schema 而它从来没跑过」在界面上看着像两条声明都在）。可用键：
#   pii-mask             pii_types
#   field-replace        rules、max_path_depth
#   json-schema          schema
#   result-filter        filter_rules、filter_mode、filter_replacement、max_line_bytes
#   http-sidecar         endpoint、headers、max_retries、idempotent
#   kb-context-inject    max_passages、max_total_bytes（都可省；缺省 8 篇 / 65536 字节，
#                        越界或写 0 一律回落缺省而不是「放到最大」，上限 100 篇 / 1MiB）
# 只有 pii-mask 与 kb-context-inject 可以没有文件：前者用内置词表 + 每请求随机 salt，
# 后者的必填件（正文交付器与两道授权判定器）本来就只能由网关注入。其余类型缺文件即拒绝启动。
#
# 为什么单独一个目录：让这些进 config.yaml 就有两个真值来源，而 sidecar 的请求头常带令牌 ——
# 那是把密钥拉进一份会被备份、被同步的文件里。HTTP 客户端、正文交付器、「原文出网」与
# 「正文进上下文」两道授权判定器与 pseudonym key 因此**不接受文件注入**：中间四件由 server 侧
# 按出网策略与生效策略包注入（见 internal/server/procruntime.go），最后一个是密钥。
# 参数文件里能写端点的只有 http-sidecar，而它写的只是 sidecar 自己的地址；
# kb-context-inject 给出一个交付端点等于绕过出网策略，给出一个判定器等于在策略内核之外
# 再造一个授权真值源 —— 这两个键不存在，写了会在启动期被拒。
#
# 只有 policy.mode=enforce 才允许这些声明参与判定（§3.0 规则 2）；
# shadow / legacy 下声明了也不会跑，加载时会出一条 warning 说破这件事 ——
# 「配了脱敏但原文照样出网」是这一屏最不能让人误解的事。
#
# processors:
#   - name: pii-cn                   # 名字是注册表的键：字母数字与 -_.:/，≤128，不可重复
#     type: pii-mask                 # 内置：pii-mask / field-replace / json-schema /
#                                    # result-filter / http-sidecar / kb-context-inject；
#                                    # 自定义类型要注册期注入
#     phase: before-upstream         # 闭集五个值：before-classify / before-route /
#                                    # before-upstream / after-upstream / audit
#     scope: organization:university # **必填**：不限范围要写成 *，留空会被读成漏配
#     version: "1"                   # **必填**：策略里点名哪一版，装配时逐字比对，不「取最新」
#     body_access: transform-body    # **必填**：metadata-only / inspect-body / transform-body
#                                    # 这一档决定处理器能不能读正文、能不能改写正文
#     fail_closed: true              # **必填**：true = 出错就拒绝请求；false = 放行原文
#     timeout_ms: 800                # 必须为正（禁止 0 = 不限），上限 120000
#     max_input_bytes: 1048576       # 必须落在 (0, 33554432]
#     max_output_bytes: 2097152      # 同上；且不得小于 max_input_bytes/4（脱敏后通常略长）
#     # allow_raw_body / allowed_endpoints 只有真会把字节发出去的类型才用：
#     # allow_raw_body: true 必须同时给出 allowed_endpoints（原文流向要可枚举、可审），
#     # 且档位不能是 metadata-only。端点禁通配、禁 userinfo、只允许 http/https。
#     # allowed_endpoints:
#     #   - https://sidecar.internal/v1/rewrite
#     #
#     # kb-context-inject 的硬约束（缺任一条都在加载期被拒，不会等到第一次请求才发现）：
#     #   phase 只能是 before-upstream；body_access 至少 transform-body（它要改写 prompt）；
#     #   allow_raw_body 必须为 true；allowed_endpoints 不能为空。
#     #   allowed_endpoints 还要**同时**覆盖检索入口与正文交付入口：请求期会逐个复查交付器
#     #   此刻报出的端点（知识源段可热更新），少列一个就是那一发在白名单里找不到落点、
#     #   整条链以「配置漂移」拒绝出网 —— 那一发同样是出网，没有只算一半的道理。
#     #   scope **不能留空也不能写 ***：正文能不能进上下文是按主体判的，一条全局命中的
#     #   注入声明等于替所有人问一次「有没有授权」。要覆盖全员就逐范围声明（kind:* 放过）。
#     # 例：
#     # - name: kb-inject
#     #   type: kb-context-inject
#     #   phase: before-upstream
#     #   scope: organization:university
#     #   version: "1"
#     #   body_access: transform-body
#     #   fail_closed: true
#     #   timeout_ms: 3000
#     #   max_input_bytes: 1048576
#     #   max_output_bytes: 1048576
#     #   allow_raw_body: true
#     #   allowed_endpoints:
#     #     - https://rag.internal/retrieve
#     #     - https://rag.internal/deliver

# ============================ 知识检索委托入口（§3.C / §3.H）============================
# 网关不做文档级权限判断（ACL 的事实只有知识源那一侧完整），这里只固定
# 「哪个知识库由哪个入口回答」。transport 由接线方从出网策略（internal/dialer）注入，
# 本段不含凭证 —— URL 里带 user:pass 会被直接拒绝，因为凭证进了 URL 就会出现在
# 日志、错误信息和审计的端点字段里。
#
# 失败一律 fail_closed：超时、响应超限、协议字段缺失、非 2xx 都按「不可读」处理，
# 绝不会退化成「放行」。这一条不是配置项，配不出一个 fail-open 的知识源。
#
# knowledge_sources:
#   - name: campus-rag               # 字母数字与 -_.:/，≤128，不可重复（审计里区分多个入口）
#     endpoint: https://rag.internal/retrieve   # 禁凭证、禁 query、禁 fragment
#     knowledge_bases:               # 至少一个：不服务任何库的源是死配置，
#       - campus-policy              # 但它仍然占着一个委托端点。库 ID 是稳定 ID，
#       - course-outline             # 参与 policy 的 knowledge:<id> + read 判定。
#                                    # 两个源不许声明同一个库（一次检索会打到两个入口，
#                                    # 引用与审计分不清是哪一篇来的）
#     timeout_ms: 1500               # 必须为正，上限 30000（超上限会把连接池拖住）
#     max_response_bytes: 1048576    # 必须为正：0 不是「不限」
#
#     # 正文交付开关（决策包 §8.1，主线 2026-10-04 裁决：配置开关，默认关）。
#     # 不写这两行 = 这个源只给引用与摘要，网关进程里不会出现一个正文字节；
#     # 行为与裁决前逐字节相同，检索那条链一个字段都没动。
#     # 打开后正文仍然进不了上下文 —— 这是三道锁里的第一道，只管方向不管篇：
#     #   ② 策略里 knowledge.content + read 与 body.raw + read 两道授权都要**显式或组级
#     #      allow**（通配 subject:"*" 走 default allow 不算授权）且各自带 expires_at；
#     #   ③ 源侧逐篇再判定（每篇必须带 rule_id，摘要对不上就整篇丢弃）。
#     # 缺 ② 的表现是处理器报 knowledge_content_grant_missing 并**跳过**（零出网），
#     # 不是 500 —— 「没授权」不该长成「服务坏了」。
#     # return_raw_body: true
#     # delivery_endpoint: https://rag.internal/deliver   # 开关为真时必填，且不能与
#     #                                                   # endpoint 相同（含只差斜杠或
#     #                                                   # 查询串这种归一化后重合）：
#     #                                                   # 共用一扇门就没法在网络层把只开
#     #                                                   # 检索的部署单独关掉正文通路。
#     #                                                   # 反过来说，写了入口却没开开关同样
#     #                                                   # 被拒 —— 那会让读配置的人以为开关是开的。

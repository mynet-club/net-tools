openapi: 3.0.3
info:
  title: llmproxy API
  description: |
    自托管 LLM 转发网关。下游 OpenAI 兼容；管理与自助接口在 `/v1/_admin` / `/v1/_me`。

    鉴权：下游用 `Authorization: Bearer <api_key 或用户 token>`；
    管理接口用 `Authorization: Bearer <admin_token>`。
  version: "2.3.0"
servers:
  - url: http://127.0.0.1:8787
    description: 本机默认
tags:
  - name: openai
    description: OpenAI 兼容下游
  - name: me
    description: 用户自助
  - name: admin
    description: 管理接口
paths:
  /v1/chat/completions:
    post:
      tags: [openai]
      summary: 对话补全
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: 成功（非流式 JSON 或流式 SSE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: 配额不足 }
        '429': { description: 限流 }
        '502': { description: 上游不可用 }
  /v1/models:
    get:
      tags: [openai]
      summary: 可用模型列表
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Model' }
  /v1/_me:
    get:
      tags: [me]
      summary: 身份、上游与累计用量
      security: [{bearerAuth: []}]
      responses:
        '200': { description: OK }
  /v1/_me/providers:
    get:
      tags: [me]
      summary: 我的上游（密钥脱敏）
      security: [{bearerAuth: []}]
      responses:
        '200': { description: OK }
  /v1/_me/providers/{name}:
    put:
      tags: [me]
      summary: 新增/覆盖一个上游
      security: [{bearerAuth: []}]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProvider' }
      responses:
        '200': { description: OK }
    delete:
      tags: [me]
      summary: 删除上游
      security: [{bearerAuth: []}]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /v1/_me/providers/{name}/discover:
    post:
      tags: [me]
      summary: 拉一次上游 /v1/models 拿模型名
      security: [{bearerAuth: []}]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 模型名列表 }
        '429': { description: 探测过于频繁 }
  /v1/_me/usage:
    get:
      tags: [me]
      summary: 我的用量
      security: [{bearerAuth: []}]
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        '200': { description: OK }
  /v1/_me/routing:
    get:
      tags: [me]
      summary: 每个模型实际会按什么顺序消费上游
      security: [{bearerAuth: []}]
      responses:
        '200': { description: OK }
  /v1/_me/knowledge:
    get:
      tags: [me]
      summary: 我的知识库准入清单（哪个库被授权、问哪个委托入口）
      description: |
        准入只由策略内核算（资源 `knowledge:<库>` + 动作 `read`），界面与本页都不重算（§9）。
        回话**不含委托端点地址**：库能不能问是用户的事，入口的网络位置属于运维面。
        `policy.mode: legacy` 下返回 501（没有策略真值源可判）。
      security: [{bearerAuth: []}]
      responses:
        '200': { description: 'policy_version / max_data_level / knowledge_bases[] / sources[]' }
        '403': { description: 身份无法构成范围链（静态 key）或范围没有生效策略包 }
        '501': { description: 未启用多用户策略链路或未配置知识源 }
  /v1/_me/knowledge/search:
    post:
      tags: [me]
      summary: 一次带策略准入的知识检索委托
      description: |
        出网前先用策略内核把候选库收窄；被拒或未被任何源声明的库一个请求都不会发出去。
        检索词只以 sha256 摘要进审计；引用只含 `source_id` + 摘要，**不含标题与正文**，
        内容请凭 source_id 回源知识源取，由源侧再判一次权限（§2.9 规则 4/6）。
        知识源失败不会返回部分结果：全失败 = 502 + 每个源的原因码，而不是「0 命中」。
        每次检索按源落一条范围审计（action `knowledge.search`）；审计落库失败则不交付结果。
      operationId: meKnowledgeSearch
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, maxLength: 4096 }
                knowledge_bases:
                  type: array
                  items: { type: string }
                  description: 只能收窄候选；没被策略准入或没被任何源声明的库会被点名拒绝
                max_results: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: 'hit_count / citations[] / denied_knowledge_bases[] / undeclared_knowledge_bases[] / failures[]' }
        '400': { description: query 为空或超长、max_results 越界、请求体含未知字段 }
        '403': { description: 身份无法构成范围链（静态 key）或范围没有生效策略包 }
        '501': { description: 未启用多用户策略链路或未配置知识源 }
        '502': { description: 所有被准入的知识源都失败（没有任何可读结果，不是没有命中） }
  /v1/_admin/users:
    get:
      tags: [admin]
      summary: 用户列表
      security: [{adminAuth: []}]
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 建用户（返回明文 token，只此一次）
      security: [{adminAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201': { description: Created }
  /v1/_admin/users/{name}:
    get:
      tags: [admin]
      summary: 用户详情
      security: [{adminAuth: []}]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
    put:
      tags: [admin]
      summary: 改配额/限流/模式/启用
      security: [{adminAuth: []}]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
    delete:
      tags: [admin]
      summary: 删用户
      security: [{adminAuth: []}]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /v1/_admin/usage/export:
    get:
      tags: [admin]
      summary: 用量 CSV 导出
      security: [{adminAuth: []}]
      description: |
        范围用精确选择器 kind:id（§2.7 规则 1）；缺省 = 全部范围。CSV 里两列成对出现：
        `day,scope_kind,scope_id,amount,currency,charge_frozen`，不给折叠成一个串的 scope。
      parameters:
        - { name: scope, in: query, schema: { type: string, example: user:alice } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
        - { name: monthly, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        '400': { description: scope 不是精确的 kind:id（裸用户名、通配、未知类型都拒） }
  /v1/_admin/audit:
    get:
      tags: [admin]
      summary: 最近管理操作审计（可按分发范围筛选）
      description: |
        每条审计都带 scope（scope_kind + scope_id 两列，§2.7 规则 1）：归属看的是这条动作
        **关于**哪个范围，而不是谁按了按钮。detail 永不包含密钥或令牌。
      security: [{adminAuth: []}]
      parameters:
        - { name: n, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - name: scope
          in: query
          description: 精确范围 kind:id（可重复给，取并集）；缺省 = 全部范围
          required: false
          schema: { type: string, example: organization:university }
      responses:
        '200': { description: 'entries: [{ts, scope{kind,id}, actor, action, target, detail}]' }
        '400': { description: scope 不是精确的 kind:id（裸用户名、通配、未知类型都拒） }
  /v1/_admin/config:
    get:
      tags: [admin]
      summary: 读配置（密钥一律脱敏）
      description: |
        下发 `api_key: ""` + `has_key` + `api_key_hint`（尾 4 位或 `${ENV}` 变量名）。
        留空在保存时意味着「沿用原值」，所以界面上回显脱敏值不会把密钥清掉。
        `max_data_level`（"" = 磁盘上没写）同样是「留空 = 沿用原值」：它是 3.0 分级门的
        事实来源，一次无关的权重调整不该把已声明的分级抹成未声明。
      security: [{adminAuth: []}]
      responses:
        '200': { description: OK }
  /v1/_admin/config/providers:
    put:
      tags: [admin]
      summary: 保存供应商段（只替换 providers 段，段外内容与注释原样）
      description: |
        写回前后各做一次加载校验（宽松通道 + 严格通道），通过后备份再原子替换。
        段外的注释、`server:` 与 `policy:` 等段落一字不动 —— 管理台改一处不该重排整份配置。
        `max_data_level` 必须是 public / internal / confidential / restricted 之一，
        否则 400 且不写文件；启用 3.0（`policy.mode` ≠ legacy）后，已启用的供应商缺它
        会在同一道校验里被拒 —— 所以「切影子模式」的前置条件就是在这里把分级逐家声明齐。
        API 上**不能**把已声明的分级改回未声明（留空=沿用，而非清空）：那是放松一条收紧
        声明，只能由直接编辑配置文件的人做。
      security: [{adminAuth: []}]
      responses:
        '200': { description: 'written / applied / backup / strict_ok' }
        '400': { description: 校验不通过，原文件未改动 }
  /v1/_admin/config/processors:
    get:
      tags: [admin]
      summary: 读处理器声明段（processors）+ 取值域
      description: |
        视图从**配置文件原文**构建，不是加载后的结构：界面要看到的是磁盘上真写着的那份。
        空段回 `processors: []` 而不是 null。
        `vocabulary` 由服务端注册表与领域上限算出来（内置类型、五个阶段、三档正文访问、
        范围种类、超时与体积上限、白名单条数上限）—— 前端不抄表，否则领域包扩充那天
        界面就成了「配置能写但选不到」的那一侧。
        `mode` + `applies` 回答「这些声明现在是否参与请求」：只有 enforce 为真（§3.0 规则 2）。
        磁盘上那一版读不回来时 GET **仍然 200**，把错误原文放在 `baseline_error`，
        列表退回显示服务当前加载着的那份 —— 管理员需要看清哪里坏了，而不是连读都被 500。
      security: [{adminAuth: []}]
      responses:
        '200': { description: 'section / path / revision / mode / applies / vocabulary / warnings / processors[] / boundary' }
    put:
      tags: [admin]
      summary: 整段保存处理器声明（只替换 processors 段，段外内容与注释原样）
      description: |
        请求体**需要且只需要** `processors` 字段，且必须是数组：缺字段不会被当成清空
        （否则一个漏带键的请求就删掉整段声明，而那是最容易点错的一次写操作）。
        清空请显式传 `[]`。未知键直接拒 —— 和配置加载同一条规则，
        拼错的键在宽松解码下会变成「一条没有期限、没有条件的声明」被发布出去。
        每条声明由 `processor.Spec.Validate()` 当场判（阶段闭集、档位与类型一致、
        绝对上限、白名单形态、version 必填），判据不在这一层重抄。
        落盘走与 providers / policy 同一条通道：临时文件宽松+严格两次试读 → 备份 → 原子改名 →
        带范围的审计（`processor.config.write`，归属 `system:global`）。
        任何一步不过都整笔还原，磁盘与审计都不留痕。
        审计 detail 只写条数、名字与范围，**不含端点与阈值数值**：基线读不回来时
        领域错误信息里可能带着含凭证的 URL，把它抄进审计库等于把凭证搬进另一个持久化位置。
      security: [{adminAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [processors]
              properties:
                processors:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, type, phase, scope, timeout_ms, max_input_bytes, max_output_bytes, fail_closed, body_access, version]
                    properties:
                      name: { type: string, example: pii-request }
                      type: { type: string, example: pii-mask, description: '内置类型不封闭：自定义类型由部署在注册期 RegisterType 注入；未注入的类型只告警不拦写，装配期才失败' }
                      phase: { type: string, enum: [before-classify, before-route, before-upstream, after-upstream, audit] }
                      scope: { type: string, example: '*', description: '必须显式写：* 或 kind:id' }
                      timeout_ms: { type: integer, example: 5000, description: '必须为正，上限见 vocabulary.max_timeout_ms' }
                      max_input_bytes: { type: integer, format: int64 }
                      max_output_bytes: { type: integer, format: int64, description: '不得小于 max_input_bytes 的 1/4' }
                      fail_closed: { type: boolean, description: '必须显式写：true = 处理器出错就拒绝请求' }
                      body_access: { type: string, enum: [metadata-only, inspect-body, transform-body], description: '必须显式写：决定能否读正文/改写正文' }
                      allow_raw_body: { type: boolean, description: '原文出网授权，必须同时给 allowed_endpoints' }
                      allowed_endpoints:
                        type: array
                        items: { type: string, example: https://sidecar.internal/v1/scan }
                        description: '出网白名单，必须可枚举（含通配、userinfo、非 http(s) 一律拒）'
                      version: { type: string, example: '1' }
      responses:
        '200': { description: 'written / applied / backup / strict_ok / count / mode / applies / note' }
        '400': { description: 请求体形状不对或声明不合法，原文件未改动 }
  /v1/_admin/config/knowledge_sources:
    get:
      tags: [admin]
      summary: 读知识源委托入口段（knowledge_sources）+ 取值域
      description: 与 `/v1/_admin/config/processors` 同一条读侧通道（原文视图、空段回 `[]`、`baseline_error`、`mode`/`applies`）。
      security: [{adminAuth: []}]
      responses:
        '200': { description: 'section / path / revision / mode / applies / vocabulary / warnings / knowledge_sources[]' }
    put:
      tags: [admin]
      summary: 整段保存知识源委托入口
      description: |
        同一套「必须带本段字段 + 整段替换 + 校验不过不动磁盘」的规则，审计动作是
        `knowledge.config.write`（归属 `system:global`）。
        端点必须过委托协议那一关（http/https、无凭证、无 fragment），知识库 ID 过 A/C 那关，
        而**两个源不许声明同一个库** —— 一次检索打到两家入口，引用与审计就分不清是哪一篇来的。
        网关不在这里实现检索，也不接受检索服务的密钥：这一段只声明约束（谁能被委托、预算多少），
        transport 由接线方从出网策略注入。
      security: [{adminAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [knowledge_sources]
              properties:
                knowledge_sources:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, endpoint, knowledge_bases, timeout_ms, max_response_bytes]
                    properties:
                      name: { type: string, example: campus-rag, description: '不含空白与路径分隔符：它要进日志与审计字段' }
                      endpoint: { type: string, example: https://rag.internal.example/v1/retrieve }
                      knowledge_bases:
                        type: array
                        items: { type: string, example: course-materials }
                        description: '不能为空（不服务任何库的源是死配置，却仍占着一个委托端点）'
                      timeout_ms: { type: integer, example: 3000, description: '上限见 vocabulary.max_knowledge_budget_ms' }
                      max_response_bytes: { type: integer, format: int64, description: '必须为正，0 不是不限' }
      responses:
        '200': { description: 'written / applied / backup / strict_ok / count / mode / applies / note' }
        '400': { description: 请求体形状不对或声明不合法，原文件未改动 }
  /v1/_admin/config/validate:
    post:
      tags: [admin]
      summary: 试算同一份保存逻辑，不落盘
      security: [{adminAuth: []}]
      responses:
        '200': { description: 能加载 }
        '400': { description: 加载失败，附错误原文 }
  /v1/_admin/policy:
    get:
      tags: [admin]
      summary: 当前生效的策略配置（只读）
      description: |
        回答「3.0 现在到底跑到哪一步」：模式、生效中的策略包版本、声明但未加载的包，
        以及**没生效时的原因**（legacy 或加载失败 + 错误原文）。
        「配了 shadow 但一根 3.0 线索都没有」是推进期最常见的困惑，这里必须说清是哪种。
        `data_level` 是**参与判定的那一层**：legacy 下它必然是 `unknown`（没有 PolicyContext，
        服务端不替配置猜一级）。配置里实际声明的值另在 `declared_data_level` 给出 ——
        两者不等就说明「这一级已经写好了，只是当前模式不用它」，别让管理台把它说成没配。
      security: [{adminAuth: []}]
      responses:
        '200': { description: OK }
  /v1/_admin/policy/simulate:
    post:
      tags: [admin]
      summary: 路由模拟（只读，不留任何痕迹）
      description: |
        按指定范围/模型跑一次 3.0 判定，返回授权结论、候选池、计划与被排除原因。
        与线上请求走同一个判定核，所以结论不会和真实判定分叉；
        它**不写**影子差异统计、不碰熔断/粘性/计量 —— 否则差异报告的一致率掺进人为流量。
        响应只出标识与结论：条件值、上游 base_url、密钥、正文一律不外泄。
      security: [{adminAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string }
                scope: { type: string, description: 空 = 系统范围；否则填用户名 }
                path: { type: string, description: 缺省 /v1/chat/completions，决定用途档位 }
                session_id: { type: string, description: 给定时按当时的粘性偏好判定 }
                request_id: { type: string, description: 给定则可复现；缺省时每次新生成 }
      responses:
        '200': { description: OK }
        '409': { description: 策略链路没在跑（legacy 或加载失败），模拟无意义 }
  /v1/_admin/policy/trace:
    get:
      tags: [admin]
      summary: 单条请求的决策痕迹（只读）
      description: |
        按 request_id 回当时的策略版本、路由代、seed 与候选摘要。
        `exactly_replayable` 只在 enforce 且计划真的作用到请求上时为 true；
        影子请求与回落旧路由的请求为 false，响应会写明只能做解释性回放。
      security: [{adminAuth: []}]
      parameters:
        - { name: request_id, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '400': { description: 缺 request_id }
        '404': { description: 没有这条请求的痕迹 }
  /v1/_admin/policy/bundles:
    get:
      tags: [admin]
      summary: 引用与内容文件并排的核对视图（只读）
      description: |
        加载是「按引用逐字段核对内容文件、全有或全无」，所以两边任一处漂了，表现都是
        **整段策略不生效**，而 `policy.mode` 仍然写着 shadow。这里把配置里的每条引用
        与磁盘上的 `<id>.yaml` 并排列出来：`matches` / `drift` 点名是哪一条，
        `drift_warning` 说明下一次热加载会发生什么，`orphans` 列出磁盘上有、配置没引用的包。
        规则只出选择器与条件**键名**，条件值与密钥不外泄。
        `data_level` / `declared_data_level` 的口径与 `GET /v1/_admin/policy` 一致：
        前者是参与判定的那一层（legacy 下必然是 `unknown`），后者是配置里声明的那一行。
      security: [{adminAuth: []}]
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 不接受（发布必须点名到 id）
      responses:
        '405': { description: '用 PUT /v1/_admin/policy/bundles/{id} 发布，POST /v1/_admin/policy/active 切生效版' }
  /v1/_admin/policy/bundles/{id}:
    put:
      tags: [admin]
      summary: 发布一个策略包版本（引用与内容文件同时改）
      description: |
        一次调用同时写两处：`policy.bundles` 里这条引用的 version/scope，以及
        `policy-bundles/<id>.yaml` 的内容。两边分开改会当场触发加载失败（两个真值来源），
        所以这里没有「只改一边」的入口。
        落盘前依次做：领域校验（未知条件键、选择器形态、效果与分级取值）→ 写内容文件 →
        改引用 → 整份配置宽松+严格加载 → **按引用加载策略集** → 备份 → 原子替换。
        任何一步失败都还原内容文件，配置文件一字不动（响应 4xx）。
        `active` 缺省为 true：发布即把这一版设为生效包；带 `"active": false` 只发布不切换。
        配置里还没有 `policy:` 段时返回 409 并指向 `/v1/_admin/policy/mode` ——
        服务端不替部署选模式。
      security: [{adminAuth: []}]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string },
            description: 会当文件名用：仅字母、数字、点、下划线、短横，1~64 位 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, scope, entitlements]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 1, description: 显式给：策略版本串是审计与回放的输入 }
                scope: { type: string, description: 'kind:id，如 system:gateway、project:cs-lab' }
                active: { type: boolean, default: true, description: false = 发布但不切生效包 }
                entitlements:
                  type: array
                  items:
                    type: object
                    required: [subject, resource, action, effect]
                    properties:
                      subject: { type: string, description: 'subject、*、role:、group:、project:、organization:' }
                      resource: { type: string, description: 'model:gpt-4o 或 model:*（通配只在尾部）' }
                      action: { type: string, description: use / search / …，可尾部通配 }
                      effect: { type: string, enum: [allow, deny] }
                      conditions:
                        type: object
                        description: |
                          保留键：purpose、organization、project、source、data-level、
                          max-data-level、min-data-level、role、group、auth-method。
                          写了非保留键直接 400 —— 判定期它是 fail-closed（规则静默不生效），
                          那正是「配了 deny 却一路放行」的事故形态。
                      expires_at: { type: string, format: date-time }
                      source: { type: string }
                      version: { type: string }
      responses:
        '200': { description: 已发布（written/applied/policy_version/backup/note） }
        '400': { description: 校验不通过，未写任何东西 }
        '409': { description: 还没有 policy 段，或引用与内容按加载器读会对不上 }
    delete:
      tags: [admin]
      summary: 撤下一条引用（内容文件保留）
      description: |
        只从 `policy.bundles` 里去掉这条引用，内容文件留在磁盘上（进 `orphans`），
        重新引用同一版就能立刻回来（`POST /v1/_admin/policy/bundles/{id}/reference`）——
        所以撤下是可回退的动作，不是删除策略。
        撤的正是生效包时必须用 `?active=<其它包>` 指定接棒者；撤掉最后一条引用返回 409
        并指向 `mode=legacy`：停用 3.0 有专门的应急开关，不该靠删引用实现。
      security: [{adminAuth: []}]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: active, in: query, schema: { type: string },
            description: 撤生效包时接棒的包 id }
      responses:
        '200': { description: 已撤下 }
        '400': { description: 需要接棒者 / 接棒者不在引用里 }
        '404': { description: 配置里没有这条引用 }
        '409': { description: 这是唯一的策略包，请改用 mode=legacy }
  /v1/_admin/policy/bundles/{id}/reference:
    post:
      tags: [admin]
      summary: 按磁盘上已有的内容文件重新建立引用（撤下的逆操作）
      description: |
        读 `policy-bundles/<id>.yaml` 那一版内容，只在配置里补回引用（内容文件一个字不改，
        因此不会凭空多出一版历史）。它存在的理由很具体：条件值不经读侧外泄，
        如果「重新启用」只能走 PUT 发布，运维就得把带条件的规则手抄回来 ——
        既是误抄的来源，也把泄露面引到了剪贴板。
        服务端以路径上的 id 为准核对内容里的 id，两者不一致时拒绝（否则会写出一条
        「挂在 foo 名下、内容却自称 bar」的引用）。配置里还没有 `policy.mode` 时返回 409
        并指向 `/v1/_admin/policy/mode`，与发布同一判断。
        `active` 缺省为 true；带 `"active": false` 只恢复引用不抢生效包。
      security: [{adminAuth: []}]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version: { type: integer, description: 给定时当作核对闸门：磁盘上不是这一版就 409 }
                active: { type: boolean, default: true, description: false = 引用但不切生效包 }
      responses:
        '200': { description: 已引用（bundle 视图只出选择器与条件键名） }
        '400': { description: id 不合法 / 请求体有未知键 }
        '409': { description: 已在引用中 / 还没有 policy 段 / 内容文件读不回来 / id 或 version 对不上 }
  /v1/_admin/policy/bundles/{id}/backups:
    get:
      tags: [admin]
      summary: 某个包的内容文件历史（只读）
      description: 按时间升序；只出文件名、版本、scope 与规则条数，不出规则内容。
      security: [{adminAuth: []}]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /v1/_admin/policy/bundles/{id}/rollback:
    post:
      tags: [admin]
      summary: 把内容回滚到历史某一版（引用同步跟回去）
      description: |
        只认这个包自己的 `.bak-` 历史：请求体里的 `backup` 取文件名，路径会被剥掉，
        因此这个端点不能用来读任意文件。引用与内容一起回 —— 只换内容会让两边当场打脸。
        当前内容在替换前会另存为新的备份，所以回滚本身也可回滚。
      security: [{adminAuth: []}]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                backup: { type: string, description: 备份文件名；缺省用最近一份 }
                version: { type: integer, description: 按版本号挑历史备份 }
      responses:
        '200': { description: 已回滚 }
        '400': { description: 指定的备份不属于这个包 }
        '404': { description: 没有历史备份 / 没有这一版历史 }
        '409': { description: 这个包当前没被引用（要重新启用请 PUT 发布） }
  /v1/_admin/policy/active:
    post:
      tags: [admin]
      summary: 切换生效包（不改任何内容文件）
      description: |
        只换 `policy.active_bundle`，即「哪一版参与判定」。引用与内容文件都不动，
        因此它是 A/B 与「切回上一版」的最小动作。目标包必须已在 `policy.bundles` 里。
      security: [{adminAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle]
              properties:
                bundle: { type: string }
      responses:
        '200': { description: 已切换 }
        '400': { description: 缺 bundle 或该包不在引用里（错误里列出可用的） }
  /v1/_admin/policy/mode:
    post:
      tags: [admin]
      summary: 切换接线模式（含应急切回 legacy）
      description: |
        `legacy` 是应急开关：改一行即刻让 3.0 停止参与判定，已配置的引用与内容原样保留，
        切回时不用重抄。`shadow`/`enforce` 要求段里同时有 `data_level`、至少一条引用和
        生效包指针 —— 缺哪一条就在错误里点名哪一条，服务端不替部署猜。
        `fallback_to_legacy: false`（策略判无可判就回 5xx，不回落旧路由）只在 enforce 下有意义。
      security: [{adminAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [legacy, shadow, enforce] }
                data_level: { type: string, enum: [public, internal, confidential, restricted] }
                fallback_to_legacy: { type: boolean }
      responses:
        '200': { description: 已切换 }
        '400': { description: 模式非法，或该模式要求的字段缺失 }
  /v1/_admin/replay:
    get:
      tags: [admin]
      summary: 回放记录采集窗口的配置与计数
      description: |
        只回答「采了多少、按什么配置采」：enabled / sample_permille / scope_filter / capacity /
        entries / decisions / routings / captured / dropped / failed，外加 as_of、policy.mode、
        当前策略版本、两条抽样算法标识（线上声明的与回放缺省的，二者不是同一算法）。
        `scope_filter` 是 kind:id 的**全串**形态（user:alice / organization:university /
        system:global），未设过滤时是空串 —— 它是管理员写过滤参数时照抄的那一串，
        两种形态各写一处就会「开关看着开着却一条都不采」。
        `record_schema_version` / `record_schema_version_readable`，以及逐位复现三件套：
        `bit_exact_primary_order`（今天为 true）、`bit_exact_algos`（承诺逐位的算法封闭集合）、
        `bit_exact_condition`（**在什么条件下**才逐位 —— 仅 v2 且带 replay_snapshot 的记录；
        v1 或无快照只做解释性回放）。只回一个 true 而不带条件，会比回 false 更误导。
        **不含任何 subject**：谁被采到只出现在导出那份文件里（§2.9 规则 6）。
        非 enforce 时带 `warning` —— 开关已开但窗口不会采集，这必须看得见。
      security: [{adminAuth: []}]
      responses:
        '200': { description: OK }
  /v1/_admin/replay/sampling:
    post:
      tags: [admin]
      summary: 改回放记录采集开关（缺省关闭）
      description: |
        指针语义：只改随请求带来的字段，缺省字段保持原值。`sample_permille` 是千分率
        （0~1000，1000 = 全采）；`scope` 是精确选择器 kind:id（显式传空串 = 清掉过滤），
        命中条件是「这次判定的请求范围等于它，或当时的范围链里有它」—— 与导出侧同一条规则，
        所以「开关设成某个组织」采到的是该组织下所有用户的判定。通配仍然 400：它按相等匹配
        会一个都匹配不上，而采集面的静默空采等于证据链当时就没开；
        `capacity` 1~4096，缩小会挤掉最旧的
        记录并计入 dropped。窗口是**进程内**有界缓冲：重启即空，溢出丢最旧。
        记录只在 `policy.mode=enforce` 且判定出了策略版本时采集；选路记录另要求计划真的
        作用到本次选路。管理口的路由模拟**不**进窗口（证据里不许掺人为流量）。
        动作 `replay.sampling.set` 落审计，归属 `system:global`。
      security: [{adminAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                sample_permille: { type: integer, minimum: 0, maximum: 1000 }
                scope: { type: string, example: user:alice }
                capacity: { type: integer, minimum: 1, maximum: 4096 }
      responses:
        '200': { description: 返回改后的窗口快照 }
        '400': { description: 取值越界、scope 不是精确 kind:id、或含未知字段 }
  /v1/_admin/replay/export:
    get:
      tags: [admin]
      summary: 导出采集窗口里的回放记录
      description: |
        响应体是记录文件本身的 JSON（`replay.File`，写出版本 schema v2），**不加任何包装字段** ——
        另一个进程拿这份文件 + 当时那套策略包就能重跑判定；包一层就等于造出
        「界面里的记录」与「文件里的记录」两份真相。
        v2 相对 v1 只多一样东西：每条选路记录承认（但不强制）带一份 `replay_snapshot`，
        即当时那份完整的 `routing.ReplayInput`。有它且 `sampling_algo` 落在
        `bit_exact_algos` 里，回放才能声称首选顺序逐位相同；v1 与无快照的记录照样能回放，
        只是降级成解释性回放，报告里会明写这一条而不是静默通过。
        内容面由 `internal/replay` 的禁用词扫描把住：正文、密钥、端点这类字段名在解码期
        就被拒，导出侧写坏了会当场 500 而不是导出一份看起来正常的文件。
        `?scope=<精确 kind:id>` 只导出命中该范围的记录（2026-10-04 裁决第 7 条 C）：
        user / organization / project / system 都认，命中条件是「这次判定的请求范围等于它，
        **或**当时的范围链里有它」。放开的代价摊开说：一次导出的暴露面从一个人涨到一个组织，
        而响应体带 subject 与规则标识 —— 这是暴露等级变化，不是便利开关；授权口径今天与其它
        管理口相同（管理凭证，不分范围），「要不要按范围再收一层」留给主线。
        今天线上流量的链上只有 user 与 system（身份映射的 claim→organization 未接进请求路径），
        所以按 org 导是**明确 0 条**：审计的 note 会写明「命中 0 条」及其原因，而不是回一个
        看起来正常的空文件。采集侧过滤（下面的 `scope`）用同一条匹配规则。
        空窗口导出一份合法的空白记录文件而不是 404。
        动作 `replay.export` 落审计，target 是那个范围引用的 kind:id 全串（不是某个用户名），
        不过滤时 target 是 `replay`；detail 只有条数与计数。
        CLI 等价入口：`llmproxy replay collect`。
      security: [{adminAuth: []}]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, example: organization:university }
      responses:
        '200': { description: 'schema_version / decisions[] / routing[]（application/json 附件；命中 0 条也是 200）' }
        '400': { description: scope 不是精确的 kind:id（通配、裸名字都拒） }
        '500': { description: 记录编码失败（采集侧缺陷，绝不下发半成品文件） }
  /v1/_admin/replay/clear:
    post:
      tags: [admin]
      summary: 清空回放记录窗口
      description: |
        只清记录与计数，不动开关与过滤条件 —— 拿走这批证据不该顺手关掉观测面。
        动作 `replay.clear` 落审计，归属 `system:global`。
      security: [{adminAuth: []}]
      responses:
        '200': { description: 返回清空后的窗口快照 }
  /v1/_admin/prices/provider:
    put:
      tags: [admin]
      summary: 录一条上游价目
      security: [{adminAuth: []}]
      responses:
        '200': { description: OK }
  /v1/_admin/prices/user:
    put:
      tags: [admin]
      summary: 录一条分发价目
      description: |
        分发价按**范围**定：body 里的 scope 是精确选择器 kind:id（user:alice、
        project:cs-lab、organization:university），全局兜底价写 system:global。
        2.x 的 `default` / `user:<名>` 前缀串不再受理 —— 读侧只认结构化范围，
        响应里也永远成对给 scope_kind + scope_id（§2.7 规则 1）。
        价目只在整点生效、按时间只追加，币种必须等于基准币。
      security: [{adminAuth: []}]
      responses:
        '200': { description: 'inserted: {scope_kind, scope_id, model, …}' }
        '400': { description: scope 非精确 kind:id / valid_from 非整点 / 往回插价 / 混币种 }
    get:
      tags: [admin]
      summary: 查某个 (范围, 模型) 的分发价历史
      security: [{adminAuth: []}]
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string, example: user:alice } }
        - { name: model, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 'scope_kind + scope_id + prices[]，按 valid_from 升序，含历史' }
        '400': { description: scope 不是精确的 kind:id，或缺 model }
  /healthz:
    get:
      tags: [openai]
      summary: 健康与运行指标
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 下游 API key 或用户 token
    adminAuth:
      type: http
      scheme: bearer
      description: admin_token
  responses:
    Unauthorized:
      description: 未鉴权
  schemas:
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              content: { type: string }
        stream: { type: boolean }
        temperature: { type: number }
    ChatResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
        choices: { type: array, items: { type: object } }
        usage: { type: object }
    Model:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
    UserProvider:
      type: object
      properties:
        base_url: { type: string }
        api_key: { type: string }
        weight: { type: number }
        timeout_ms: { type: integer }
        proxy: { type: string }
        models:
          description: '"*" 或 映射表'
          oneOf:
            - { type: string }
            - { type: object }
